<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Akun Game">
<title>Akun Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{
    --bg:#0a0a14;
    --surf:#14142a;
    --surf2:#1d1d3a;
    --line:#26264a;
    --ink:#f5f5ff;
    --muted:#8d8db3;
    --a:#7c5cff;--b:#2de2c4;--c:#ff6ba6;
    --y:#f5c542;--g:#3ddc84;--r:#ff6b8a;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;background:var(--bg)}
  body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;font-weight:500}
  button,input,textarea{font:inherit;color:inherit;border:0;outline:none;background:none}
  input{width:100%}
  .muted{color:var(--muted)}

  .i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* splash */
  #splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .7s var(--ease),visibility .7s}
  #splash.gone{opacity:0;visibility:hidden}
  #splash .delta{font-size:96px;font-weight:800;line-height:1;background:linear-gradient(120deg,var(--a),var(--b),var(--c));
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* latar */
  #bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .aurora{position:fixed;inset:-30vmax;z-index:0;pointer-events:none;filter:blur(100px);opacity:.14;
    background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));animation:spin 46s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* layar */
  #app{position:fixed;inset:0;z-index:1}
  .view{position:absolute;inset:0;display:none;overflow-y:auto;max-width:760px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 100px)}
  .view.on{display:block;animation:enter .4s var(--ease) both}
  .view.on.rev{animation-name:enterRev}
  #v-lock.on{display:flex;align-items:center;justify-content:center}
  @keyframes enter{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes enterRev{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* indikator simpan */
  #dockbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);display:flex;justify-content:center;z-index:6;pointer-events:none}
  #dot{width:14px;height:5px;border-radius:99px;background:#2b2b48;transition:background .35s var(--ease),width .35s var(--ease)}
  #dot.busy{width:34px;background:var(--a);animation:swing 1.1s var(--ease) infinite alternate}
  #dot.ok{width:14px;background:var(--g)}
  #dot.err{width:14px;background:var(--r);pointer-events:auto;cursor:pointer}
  @keyframes swing{from{transform:translateX(-26px)}to{transform:translateX(26px)}}

  /* pesan kecil */
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 50px);transform:translate(-50%,8px);opacity:0;
    background:var(--surf2);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap;
    transition:opacity .25s,transform .25s var(--ease);pointer-events:none;z-index:7}
  #hint.show{opacity:1;transform:translate(-50%,0)}

  /* kunci */
  .lock{width:min(340px,100%);display:grid;gap:30px;justify-items:center;text-align:center}
  .lock .delta{font-size:64px;font-weight:800;line-height:1;background:linear-gradient(120deg,var(--a),var(--b),var(--c));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lock h2{font-size:12px;font-weight:800;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
  .bars{display:flex;gap:12px;height:12px;align-items:center}
  .bars i{width:14px;height:4px;border-radius:99px;background:var(--surf2);transition:background .25s,width .25s var(--ease)}
  .bars i.on{background:var(--a);width:28px}
  .bars.shake{animation:shake .4s}
  .keys{display:grid;grid-template-columns:repeat(3,84px);gap:14px 20px}
  .keys button{height:84px;font-size:30px;font-weight:700;border-radius:24px;background:var(--surf);
    transition:transform .12s var(--ease),background .15s}
  .keys button:active{transform:scale(.92);background:var(--surf2)}
  .keys button.del{color:var(--muted)}
  .keys button.ghost{visibility:hidden}
  .err{min-height:18px;font-size:14px;color:var(--r);font-weight:700}

  /* bar atas */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .top .t{flex:1;min-width:0}
  .top h1{font-size:28px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
  .top small{display:block;color:var(--muted);font-size:14px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--surf);
    color:var(--ink);cursor:pointer;flex:none;transition:transform .12s var(--ease),background .15s}
  .ib:active{transform:scale(.92);background:var(--surf2)}
  .ib.sm{width:36px;height:36px;border-radius:12px}
  .ib.sm .i{width:18px;height:18px}

  /* tombol & isian */
  .btn{height:54px;padding:0 22px;border-radius:17px;font-weight:800;font-size:16px;cursor:pointer;background:var(--surf2);
    display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s var(--ease),background .15s}
  .btn:active{transform:scale(.97)}
  .btn.main{background:var(--a);color:#fff}
  .btn.danger{color:var(--r);background:rgba(255,107,138,.12)}
  .btn.block{width:100%}
  .btns{display:flex;gap:10px;margin-top:10px}
  .btns .btn{flex:1}
  .form{display:grid;gap:18px}
  .fld{display:grid;gap:8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
  .fld input{height:56px;padding:0 18px;border-radius:17px;background:var(--surf);border:1.5px solid var(--line);
    color:var(--ink);font-size:17px;font-weight:600;transition:border-color .15s}
  .fld input:focus{border-color:var(--a)}
  .fld input[type=color]{padding:8px;height:56px}
  .pwrow{display:flex;gap:8px;align-items:center}
  .pwrow input{flex:1}
  .prev{width:100%;max-width:200px;aspect-ratio:1/1;justify-self:center;border-radius:22px;overflow:hidden;display:grid;place-items:center;
    font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--c,#7c5cff),#1a1a33)}
  .prev img{width:100%;height:100%;object-fit:cover}
  .search{width:100%;height:52px;border-radius:17px;background:var(--surf);border:1.5px solid var(--line);
    padding:0 18px;margin-bottom:14px;font-size:16px;font-weight:600;transition:border-color .15s}
  .search::placeholder{color:var(--muted);font-weight:600}
  .search:focus{border-color:var(--a)}
  .hit{width:100%;display:grid;gap:4px;text-align:left;padding:14px 16px;border-radius:17px;background:var(--surf);margin-bottom:10px}
  .hit b{font-weight:800;font-size:16px}
  .hit small{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .add{margin-top:14px}

  /* dashboard: game 1:1 */
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .gcard{position:relative;text-align:left;border-radius:22px;background:var(--surf);padding:8px;display:grid;gap:9px;
    cursor:pointer;animation:enter .45s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms);transition:transform .15s var(--ease)}
  .gcard:active{transform:scale(.97)}
  .thumb{width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:800;
    background:linear-gradient(135deg,var(--c,#7c5cff),#1a1a33)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .gcard .nm{font-weight:800;font-size:15px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcard small{padding:0 4px 4px;color:var(--muted);font-weight:700;font-size:13px}
  .gedit{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:12px;background:rgba(10,10,20,.75);
    display:grid;place-items:center}

  /* kalender */
  .wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wk span{text-align:center;font-size:12px;color:var(--muted);font-weight:800;padding:2px 0 8px;letter-spacing:.04em}
  .cell{position:relative;aspect-ratio:1;border-radius:14px;background:var(--surf);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
    animation:enter .35s var(--ease) both;animation-delay:calc(var(--i,0) * 10ms);transition:transform .12s var(--ease)}
  .cell:active{transform:scale(.92)}
  .cell.blank{background:none;pointer-events:none}
  .cell .n{font-weight:800;font-size:15px}
  .cell.today{box-shadow:inset 0 0 0 2px var(--b)}
  .cell .c{font-size:10px;color:var(--muted);font-weight:800}
  .cell.full .c{color:var(--g)}

  /* daftar akun (ringkas) */
  .arow{display:grid;gap:8px;padding:11px 12px;border-radius:17px;background:var(--surf);margin-bottom:8px}
  .line{display:flex;align-items:center;gap:6px;min-width:0}
  .uname{flex:1;min-width:0;text-align:left;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .sub{display:flex;align-items:center;gap:8px}
  .anote{flex:1;min-width:0;height:34px;border-radius:10px;background:var(--surf2);padding:0 11px;font-size:14px;font-weight:600;
    color:#e4e4f8;border:1.5px solid transparent;transition:border-color .15s}
  .anote:focus{border-color:var(--a)}
  .anote::placeholder{color:#6a6a8e;font-weight:600}

  /* kotak centang: visual kecil, area tekan tetap besar */
  .marks{display:flex;flex:none}
  .mk{position:relative;width:30px;height:30px;background:transparent}
  .mk::before{content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    background:var(--surf2);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .08s linear}
  .mk:active::before{transform:scale(.8)}
  .mk.y::before{background:var(--y);box-shadow:none}
  .mk.g::before{background:var(--g);box-shadow:none}

  .empty{color:var(--muted);padding:24px 4px;font-weight:700}

  .hi{padding:12px 14px;border-radius:15px;background:var(--surf);display:grid;gap:3px;font-size:14px;font-weight:600}
  .hi small{color:var(--muted);font-weight:700}
  .section{margin-bottom:24px}
  .section h3{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:12px;text-transform:uppercase;letter-spacing:.16em}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
    .aurora{display:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12.5L20 4M16 8l3 3M14 10l2 2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.5 9.5 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.8 3.5M6.5 7.3A16 16 0 0 0 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></symbol>
    <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M21 6H9.5L4 12l5.5 6H21a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M17 9.5l-4.5 5M12.5 9.5l4.5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 13.5l5-5 5 5M5 4h14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9.5" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></symbol>
  </defs>
</svg>

<div id="splash"><div class="delta">Δ</div></div>
<canvas id="bgc" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>

<div id="app">

  <!-- KUNCI -->
  <section class="view on" id="v-lock">
    <div class="lock">
      <div class="delta">Δ</div>
      <h2>Akun Game</h2>
      <div class="bars" id="bars"></div>
      <div class="keys" id="keys"></div>
      <p class="err" id="lockErr"></p>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section class="view" id="v-home">
    <header class="top">
      <div class="t"><h1>Akun Game</h1><small>Pilih game</small></div>
      <button class="ib" id="openSet" aria-label="Pengaturan"><svg class="i"><use href="#i-sliders"/></svg></button>
    </header>
    <input class="search" id="q" placeholder="Cari username atau catatan" autocomplete="off">
    <div id="results"></div>
    <div class="games" id="games"></div>
    <button class="btn main block add" id="addGame"><svg class="i"><use href="#i-plus"/></svg>Tambah game</button>
  </section>

  <!-- KALENDER -->
  <section class="view" id="v-cal">
    <header class="top">
      <button class="ib" data-back aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="t"><h1 id="calTitle"></h1><small id="calSub"></small></div>
      <button class="ib" id="prev" aria-label="Bulan sebelumnya"><svg class="i"><use href="#i-left"/></svg></button>
      <button class="ib" id="next" aria-label="Bulan berikutnya"><svg class="i"><use href="#i-right"/></svg></button>
    </header>
    <div class="wk"><span>SEN</span><span>SEL</span><span>RAB</span><span>KAM</span><span>JUM</span><span>SAB</span><span>MIN</span></div>
    <div class="grid" id="grid" style="margin-top:8px"></div>
  </section>

  <!-- CENTANG HARIAN -->
  <section class="view" id="v-day">
    <header class="top">
      <button class="ib" data-back aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="t"><h1 id="dayTitle"></h1><small id="dayGame"></small></div>
    </header>
    <div id="accs"></div>
    <button class="btn main block add" id="addAcc"><svg class="i"><use href="#i-plus"/></svg>Tambah akun</button>
  </section>

  <!-- EDIT AKUN -->
  <section class="view" id="v-acc">
    <header class="top">
      <button class="ib" data-back aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="t"><h1 id="accTitle">Akun</h1></div>
    </header>
    <div class="form">
      <label class="fld">USERNAME / ID
        <input id="fUser" autocomplete="off" maxlength="120">
      </label>
      <label class="fld">PASSWORD
        <div class="pwrow">
          <input id="fPass" type="password" autocomplete="off" maxlength="200">
          <button class="ib sm" id="eye" type="button" aria-label="Tampilkan password"><svg class="i"><use href="#i-eye"/></svg></button>
        </div>
      </label>
      <label class="fld">CATATAN
        <input id="fNote" maxlength="200" placeholder="misal: kurang satu run">
      </label>
      <div class="btns">
        <button class="btn danger" id="accDel"><svg class="i"><use href="#i-trash"/></svg><span>Hapus</span></button>
        <button class="btn main" id="accSave">Simpan</button>
      </div>
    </div>
  </section>

  <!-- EDIT GAME -->
  <section class="view" id="v-game">
    <header class="top">
      <button class="ib" data-back aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="t"><h1 id="gTitle">Game</h1></div>
    </header>
    <div class="form">
      <label class="fld">NAMA GAME
        <input id="gName" maxlength="80">
      </label>
      <label class="fld">URL GAMBAR (OPSIONAL)
        <input id="gImg" type="url" placeholder="https://…/gambar.jpg" maxlength="500">
      </label>
      <label class="fld">WARNA
        <input id="gColor" type="color" value="#7c5cff">
      </label>
      <div class="prev" id="gPrev"></div>
      <div class="btns">
        <button class="btn main" id="gSave">Simpan</button>
      </div>
    </div>
  </section>

  <!-- PENGATURAN -->
  <section class="view" id="v-set">
    <header class="top">
      <button class="ib" data-back aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="t"><h1>Pengaturan</h1></div>
    </header>
    <div class="section">
      <h3>Backup & restore</h3>
      <div class="form">
        <button class="btn" id="backup"><svg class="i"><use href="#i-download"/></svg>Backup ke file</button>
        <label class="btn" style="cursor:pointer"><svg class="i"><use href="#i-upload"/></svg>Pilih file backup
          <input id="fileImport" type="file" accept="application/json" hidden>
        </label>
        <button class="btn danger" id="importGo" hidden>Konfirmasi restore (mengganti semua data)</button>
        <p class="muted" id="setMsg" style="font-size:14px;font-weight:700"></p>
      </div>
    </div>
    <div class="section">
      <h3>Keamanan</h3>
      <button class="btn block" id="lockNow"><svg class="i"><use href="#i-lock"/></svg>Kunci sekarang</button>
    </div>
    <div class="section">
      <h3>Riwayat</h3>
      <div class="form" id="hist"></div>
    </div>
  </section>
</div>

<div id="hint" role="status"></div>
<div id="dockbar"><div id="dot" title="Status simpan"></div></div>

<script>
(() => {
  // GANTI dengan URL Web app dari Apps Script (berakhiran /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbzPsh7e9HYzjAHO2xawDY4z-65VVoW-4SxlfAClzo5FITmtSnylLaIrPDT0dSBUGUDZ3w/exec';

  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const nowIso = () => new Date().toISOString();
  const mk = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const initials = (n) => (n || '?').trim().split(/\s+/).map((w) => w[0] || '').join('').slice(0, 2).toUpperCase();
  const MARKS = 5;
  const EMPTY_MARKS = '-'.repeat(MARKS);
  const HIST_SHOW = 15;

  const S = {
    pin: '', pinBuf: '',
    games: [], accounts: [], checks: [], history: [],
    gameId: null, day: null, month: new Date(),
    accId: null, editGameId: null,
    queue: [], busy: false,
    exitUntil: 0, histAll: false,
  };

  // ---------- API ----------
  async function api(action, payload = {}) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pin: S.pin, action, ...payload }),
      });
    } catch (_) {
      throw new Error('Tidak bisa terhubung ke server');
    }
    let data;
    try { data = await res.json(); }
    catch (_) { throw new Error('Respons server tidak valid, cek akses deployment'); }
    if (!data.ok) throw new Error(data.error || 'Gagal');
    return data;
  }

  // ---------- Indikator simpan ----------
  function setDot(state) { $('#dot').className = state; }
  // Perubahan langsung tampil lalu dikirim berurutan. Yang gagal tetap di antrean.
  function save(action, payload) {
    S.queue.push({ action, payload });
    return flush();
  }
  async function flush() {
    if (S.busy) return;
    S.busy = true;
    while (S.queue.length) {
      setDot('busy');
      try {
        await api(S.queue[0].action, S.queue[0].payload);
        S.queue.shift();
      } catch (e) {
        S.busy = false;
        setDot('err');
        return;
      }
    }
    S.busy = false;
    setDot('ok');
  }
  $('#dot').onclick = () => { if ($('#dot').classList.contains('err')) flush(); };

  let hintTimer;
  function hint(text) {
    const h = $('#hint');
    h.textContent = text;
    h.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => h.classList.remove('show'), 2400);
  }

  async function loadAll() {
    const d = await api('load');
    S.games = d.games; S.accounts = d.accounts; S.checks = d.checks; S.history = d.history;
  }

  // ---------- Navigasi (riwayat browser = tombol back) ----------
  function go(id, isBack = false, fromPop = false) {
    const cur = document.querySelector('.view.on');
    if (cur && cur.id === id) return;
    if (cur) cur.classList.remove('on');
    const next = document.getElementById(id);
    next.classList.toggle('rev', isBack);
    next.classList.add('on');
    next.scrollTop = 0;
    if (!fromPop) history.pushState({ v: id }, '');
    render(id);
  }
  function back() { history.back(); }
  function render(id) {
    if (id === 'v-home') renderHome();
    if (id === 'v-cal') renderCal();
    if (id === 'v-day') renderDay();
    if (id === 'v-set') renderSet();
  }
  function setTint(g) {
    document.documentElement.style.setProperty('--tint', g && g.color ? g.color : '#7c5cff');
  }
  document.querySelectorAll('[data-back]').forEach((b) => { b.onclick = back; });

  // back Android/browser:
  //  - layar lain: kembali ke layar sebelumnya
  //  - dashboard: tekan sekali untuk peringatan, tekan lagi dalam 2,5 detik untuk keluar
  //  - belum buka kunci: tetap di layar kunci
  window.addEventListener('popstate', (e) => {
    const target = (e.state && e.state.v) || 'v-lock';
    if (!S.pin) { go('v-lock', true, true); return; }
    if (target === 'v-lock') {
      if (Date.now() < S.exitUntil) {
        S.exitUntil = 0;
        history.back();
        return;
      }
      S.exitUntil = Date.now() + 2500;
      history.pushState({ v: 'v-home' }, '');
      hint('Tekan kembali sekali lagi untuk keluar');
      return;
    }
    go(target, true, true);
  });

  // ---------- Kunci ----------
  const KEYS = ['1','2','3','4','5','6','7','8','9','','0','del'];
  function buildKeys() {
    const box = $('#keys');
    KEYS.forEach((k) => {
      if (!k) { box.appendChild(mk('button', 'ghost')); return; }
      const b = mk('button', k === 'del' ? 'del' : '');
      if (k === 'del') b.innerHTML = ic('backspace');
      else b.textContent = k;
      b.onclick = () => press(k);
      box.appendChild(b);
    });
  }
  function buildBars() {
    const box = $('#bars');
    for (let i = 0; i < 6; i++) box.appendChild(mk('i'));
  }
  function paintBars() {
    [...$('#bars').children].forEach((b, i) => b.classList.toggle('on', i < S.pinBuf.length));
  }
  function press(k) {
    if (k === 'del') S.pinBuf = S.pinBuf.slice(0, -1);
    else if (S.pinBuf.length < 6) S.pinBuf += k;
    paintBars();
    if (S.pinBuf.length === 6) tryUnlock();
  }
  async function tryUnlock() {
    S.pin = S.pinBuf;
    try {
      await api('login');
    } catch (e) {
      S.pin = ''; S.pinBuf = ''; paintBars();
      const bars = $('#bars');
      bars.classList.add('shake');
      setTimeout(() => bars.classList.remove('shake'), 450);
      $('#lockErr').textContent = e.message;
      return;
    }
    try {
      await loadAll();
    } catch (e) {
      $('#lockErr').textContent = e.message;
      return;
    }
    S.pinBuf = ''; paintBars(); $('#lockErr').textContent = '';
    S.exitUntil = 0;
    go('v-home');
  }
  document.addEventListener('keydown', (e) => {
    if (!$('#v-lock').classList.contains('on')) return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
  });
  $('#lockNow').onclick = () => {
    S.pin = ''; S.gameId = null; S.day = null;
    S.games = []; S.accounts = []; S.checks = []; S.history = [];
    setTint(null);
    go('v-lock');
  };

  // ---------- Dashboard ----------
  function renderHome() {
    const box = $('#games');
    box.textContent = '';
    if (!S.games.length) box.appendChild(mk('p', 'empty', 'Belum ada game. Ketuk "Tambah game" di bawah.'));
    S.games.forEach((g, i) => {
      const count = accountsOf(g.id).length;
      const card = mk('div', 'gcard');
      card.style.setProperty('--i', i);
      card.style.setProperty('--c', g.color || '#7c5cff');
      const th = mk('div', 'thumb');
      if (g.image_url) {
        const img = mk('img');
        img.src = g.image_url;
        img.alt = '';
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.onerror = () => { img.remove(); th.textContent = initials(g.name); };
        th.appendChild(img);
      } else {
        th.textContent = initials(g.name);
      }
      const ed = mk('button', 'gedit');
      ed.innerHTML = ic('pen');

      ed.onclick = (e) => { e.stopPropagation(); openGameForm(g); };

  function openGame(id) {
    const g = S.games.find((x) => x.id === id);
    if (!g) return;
    S.gameId = id;
    S.month = new Date();
    setTint(g);
    go('v-cal');
  }
  $('#openSet').onclick = () => go('v-set');
  $('#addGame').onclick = () => openGameForm(null);

  // ---------- Pencarian ----------
  $('#q').oninput = renderSearch;
  function renderSearch() {
    const q = $('#q').value.trim().toLowerCase();
    const box = $('#results');
    box.textContent = '';
    if (!q) return;
    S.accounts
      .filter((a) => (a.username + ' ' + a.note).toLowerCase().includes(q))
      .slice(0, 60)
      .forEach((a) => {
        const g = S.games.find((x) => x.id === a.game_id);
        const r = mk('button', 'hit');
        r.append(
          mk('b', '', a.username || '(tanpa nama)'),
          mk('small', '', [g && g.name, a.note].filter(Boolean).join(' · '))
        );
        r.onclick = () => {
          S.gameId = a.game_id;
          S.month = new Date();

  // ---------- Data helper ----------
  function accountsOf(gid) { return S.accounts.filter((a) => a.game_id === gid); }
  function checkOf(accId, date) { return S.checks.find((x) => x.id === accId + '|' + date); }
  function marksFor(accId, date) {
    const c = checkOf(accId, date);
    return (c && c.marks ? c.marks : EMPTY_MARKS).padEnd(MARKS, '-').slice(0, MARKS).split('');
  }
  function isChecked(accId, date) {
    return marksFor(accId, date).some((m) => m !== '-');
  }

  // ---------- Kalender ----------
  function renderCal() {
    const g = S.games.find((x) => x.id === S.gameId);
    if (!g) return;
    $('#calTitle').textContent = g.name;
    const m = S.month;
    const y = m.getFullYear(), mo = m.getMonth();
    $('#calSub').textContent = m.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

    const grid = $('#grid');
    grid.textContent = '';
    const offset = (new Date(y, mo, 1).getDay() + 6) % 7;
    const total = new Date(y, mo + 1, 0).getDate();
    const today = ymd(new Date());
    const accs = accountsOf(g.id);
    for (let i = 0; i < offset; i++) grid.appendChild(mk('div', 'cell blank'));
    for (let d = 1; d <= total; d++) {
      const key = `${y}-${pad(mo + 1)}-${pad(d)}`;
      const checked = accs.filter((a) => isChecked(a.id, key)).length;
      const full = accs.length > 0 && checked === accs.length;
      const cell = mk('div', 'cell' + (key === today ? ' today' : '') + (full ? ' full' : ''));
      cell.style.setProperty('--i', d);
      cell.appendChild(mk('span', 'n', String(d)));
      if (accs.length && checked) cell.appendChild(mk('span', 'c', checked + '/' + accs.length));
      cell.onclick = () => { S.day = key; go('v-day'); };
      grid.appendChild(cell);
    }
  }
  $('#prev').onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); renderCal(); };
  $('#next').onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); renderCal(); };

  // ---------- Centang harian ----------
  // Akun yang sudah punya tanda hijau naik ke atas, urut dari yang paling dulu selesai.
  // Sisanya tetap di urutan semula di bawahnya.
  function renderDay() {
    const g = S.games.find((x) => x.id === S.gameId);
    if (!g) return;
    if (!S.day) S.day = ymd(new Date());
    const isToday = S.day === ymd(new Date());
    $('#dayTitle').textContent = new Date(S.day + 'T00:00:00')
      .toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
    $('#dayGame').textContent = g.name + (isToday ? ' · hari ini' : '');

    const list = $('#accs');
    list.textContent = '';
    const accs = accountsOf(g.id);
    if (!accs.length) { list.appendChild(mk('p', 'empty', 'Belum ada akun. Ketuk "Tambah akun" di bawah.')); return; }

    const rows = accs.map((a) => {
      const arr = marksFor(a.id, S.day);
      const c = checkOf(a.id, S.day);
      return { a, green: arr.includes('g'), at: (c && c.done_at) || '' };
    });
    const doneRows = rows.filter((r) => r.green).sort((x, y) => (x.at < y.at ? -1 : x.at > y.at ? 1 : 0));
    const todoRows = rows.filter((r) => !r.green);
    [...doneRows, ...todoRows].forEach((r) => list.appendChild(accRow(r.a)));
  }

  function accRow(a) {
    const row = mk('div', 'arow');

    // baris 1: username + salin
    const line = mk('div', 'line');
    const un = mk('div', 'uname', a.username || '(tanpa nama)');
    un.onclick = () => openAcc(a.id);
    const cu = mk('button', 'ib sm');
    cu.innerHTML = ic('copy');
    cu.setAttribute('aria-label', 'Salin username');
    cu.onclick = () => copy(a.username, cu);
    const cp = mk('button', 'ib sm');
    cp.innerHTML = ic('key');
    cp.setAttribute('aria-label', 'Salin password');
    cp.onclick = () => copy(a.password, cp);
    line.append(un, cu, cp);

    // baris 2: catatan tetap + kotak centang harian
    const sub = mk('div', 'sub');
    const note = mk('input', 'anote');
    note.value = a.note || '';
    note.placeholder = 'Catatan';
    note.maxLength = 200;
    note.onchange = () => {
      const v = note.value.trim();
      if (v === (a.note || '')) return;
      a.note = v;
      a.updated_at = nowIso();
      save('saveAccount', { item: { ...a } });
    };
    note.onkeydown = (e) => { if (e.key === 'Enter') note.blur(); };

    const marks = mk('div', 'marks');
    marksFor(a.id, S.day).forEach((st, idx) => {
      const b = mk('button', 'mk' + (st === 'y' ? ' y' : st === 'g' ? ' g' : ''));
      b.setAttribute('aria-label', 'Tanda ' + (idx + 1));
      b.onclick = () => toggleMark(a, idx);
      marks.appendChild(b);
    });

    sub.append(note, marks);
    row.append(line, sub);
    return row;
  }

  // ketuk: kosong -> kuning -> hijau -> kosong
  function toggleMark(a, idx) {
    const arr = marksFor(a.id, S.day);
    const wasGreen = arr.includes('g');
    arr[idx] = arr[idx] === '-' ? 'y' : arr[idx] === 'y' ? 'g' : '-';
    const isGreen = arr.includes('g');
    const key = a.id + '|' + S.day;
    const prev = checkOf(a.id, S.day);
    let doneAt = (prev && prev.done_at) || '';
    if (!wasGreen && isGreen) doneAt = nowIso();
    if (wasGreen && !isGreen) doneAt = '';
    const item = {
      id: key, account_id: a.id, date: S.day,
      marks: arr.join(''), updated_at: nowIso(), done_at: doneAt,
    };
    S.checks = S.checks.filter((c) => c.id !== key).concat(item);
    save('saveCheck', { item });
    renderDay();
  }

  $('#addAcc').onclick = () => openAcc(null);

  $('#accDel').onclick = () => {

    S.accounts = S.accounts.filter((x) => x.id !== id);
    S.checks = S.checks.filter((c) => c.account_id !== id);

  // ---------- Pengaturan ----------
  let pendingImport = null;
  function setMsg(t) { $('#setMsg').textContent = t; }
  function renderSet() {
    setMsg('');
    const box = $('#hist');
    box.textContent = '';
    if (!S.history.length) { box.appendChild(mk('p', 'muted', 'Belum ada riwayat.')); return; }

  $('#backup').onclick = async () => {
    try {
      const d = await api('export');
      const blob = new Blob(
        [JSON.stringify({ version: 3, exported_at: nowIso(), ...d.data }, null, 2)],

      );

  $('#fileImport').onchange = async (e) => {

  // ---------- Salin ----------
  function copy(text, btn) {
    if (!text) return;
    const old = btn.innerHTML;
    const done = () => {
      btn.innerHTML = ic('check');
      setTimeout(() => { btn.innerHTML = old; }, 1000);
    };
    const fallback = () => {
      const t = mk('textarea');
      t.value = text;
      document.body.appendChild(t);
      t.select();
      try { document.execCommand('copy'); } catch (_) {}
      t.remove();
      done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  // ---------- Latar ----------
  const cv = $('#bgc');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hues = ['124,92,255', '45,226,196', '255,107,166'];
  let orbs = [];
  function sizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(30, Math.floor((innerWidth * innerHeight) / 30000));
    orbs = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: 1 + Math.random() * 2.4,
      vx: (Math.random() - 0.5) * 0.14,
      vy: (Math.random() - 0.5) * 0.14,
      c: hues[(Math.random() * hues.length) | 0],
      p: Math.random() * Math.PI * 2,
    }));
  }
  function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const o of orbs) {
      o.x += o.vx + Math.sin(t / 3200 + o.p) * 0.1;
      o.y += o.vy + Math.cos(t / 3600 + o.p) * 0.1;
      if (o.x < -20) o.x = innerWidth + 20;
      if (o.x > innerWidth + 20) o.x = -20;
      if (o.y < -20) o.y = innerHeight + 20;
      if (o.y > innerHeight + 20) o.y = -20;
      const a = 0.12 + 0.12 * Math.sin(t / 1600 + o.p);
      ctx.fillStyle = `rgba(${o.c},${a})`;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  sizeCanvas();
  addEventListener('resize', sizeCanvas);
  requestAnimationFrame(frame);

  // ---------- Init ----------
  history.replaceState({ v: 'v-lock' }, '');
  buildKeys();
  buildBars();
  setDot('');
  addEventListener('load', () => setTimeout(() => $('#splash').classList.add('gone'), 900));
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
